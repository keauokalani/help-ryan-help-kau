<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Admin login | Help Ryan Help Kaʻū</title><link rel="icon" href="./favicon.svg"><link rel="stylesheet" href="./style.css"><script type="module" src="./admin.js"></script></head><body><main class="admin-wrap"><a href="./">← Back to the website</a><h1>Admin login</h1><p>Post photos and videos to the progress blog.</p><p id="status" class="status" role="status" aria-live="polite">Checking connection…</p><section id="login-panel"><form id="login"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><div class="toolbar"><button class="button" id="login-button">Log in</button></div></form></section><section id="editor-panel" hidden><div class="toolbar"><button class="button secondary" id="new">New post</button><button class="button secondary" id="logout">Log out</button></div><form id="editor"><input type="hidden" id="record-id"><label for="media">Photo or video</label><input id="media" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"><p class="hint">Choose a photo or a video up to 1 minute (25 MB maximum). Photos are automatically resized.</p><p id="existing-media" class="hint"></p><label for="title">Post title</label><input id="title" maxlength="160" required><label for="caption">Caption</label><textarea id="caption" maxlength="500" placeholder="Describe what’s happening in the photo or video." required></textarea><div id="video-fields" hidden><label for="transcript">Video description and spoken words</label><textarea id="transcript" maxlength="50000"></textarea><p class="hint">Describe the action and include spoken words so visitors can follow without sound.</p></div><div class="toolbar"><button class="button" id="publish" type="submit">Publish</button></div></form><h2>Your posts</h2><div id="records"></div></section></main></body></html>
